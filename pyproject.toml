# =============================================================================
# pyproject.toml — fonte única de verdade para dependências e configuração de
# ferramentas. Alinhado ao CLAUDE.md (Data Science Projects).
# Gerenciador recomendado: uv. Lock file (uv.lock) DEVE ser commitado.
# =============================================================================

[project]
name = "sentimento-ptbr-llm"
version = "0.2.0"
description = "Estudo comparativo entre ML clássico, Deep Learning/Transformers e LLMs locais para análise de sentimentos (positivo/negativo/neutro) em tweets em português brasileiro."
readme = "README.md"
requires-python = ">=3.10,<3.14"  # numba (dependência transitiva do shap) ainda não suporta 3.14
license = { text = "MIT" }
authors = [{ name = "Luan Freitas", email = "luan.mgf@gmail.com" }]
keywords = [
    "nlp",
    "sentiment-analysis",
    "portuguese",
    "pt-br",
    "twitter",
    "llm",
    "transformers",
    "bertimbau",
    "machine-learning",
    "deep-learning",
    "langchain",
    "ollama",
    "mlops",
]
classifiers = [ # https://pypi.org/classifiers/
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: Microsoft :: Windows :: Windows 11",
]

# --- Dependências de runtime (instale apenas o que o projeto precisar) -------
# Organizadas por finalidade; dependências pesadas/específicas de uma etapa
# (LLM, coleta, PLN, DVC, dashboard) ficam em [project.optional-dependencies].
dependencies = [
    # Configuração, validação e ambiente (src/config/)
    "pydantic>=2.13.5",                         # validação de dados e configurações
    "pydantic-settings>=2.15.0",                # configuração de projeto via .env
    "python-dotenv>=1.2.3",                     # carregamento de variáveis de ambiente
    "pyyaml>=6.0.3",                            # leitura e escrita de arquivos YAML

    # Dados: manipulação, I/O e validação de schema
    "joblib>=1.6.0",                            # serialização de modelos scikit-learn
    "pandas>=2.3.3",                            # manipulação de dados tabulares
    "pandera[polars]>=0.33.1",                  # validação de dados (contratos por estágio)
    "polars>=1.44.1",                           # manipulação de dados estruturados (preferido sobre pandas)
    "pyarrow>=25.0.1",                          # leitura e escrita de arquivos em formato Parquet

    # Machine Learning, estatística e interpretabilidade
    "numpy>=2.2.6",                             # arrays e álgebra linear
    "scikit-learn>=1.7.2",                      # ML clássico (Regressão Logística, SVM, Random Forest etc.)
    "scipy>=1.15.3",                            # álgebra linear, estatística e otimização
    "shap>=0.49.1",                             # interpretação de modelos (SHAP values)
    "statsmodels>=0.15.0",                      # testes de significância estatística (Wilcoxon/Friedman)
    "xgboost>=3.2.0",                           # Gradient Boosting

    # Rastreamento de experimentos (MLflow — tracking + Model Registry)
    "mlflow>=3.16.0",                           # gerenciamento de experimentos

    # Visualização (reports/figures/, src/visualization/)
    "matplotlib>=3.10.9",                       # visualização de dados
    "seaborn>=0.13.2",                          # visualização de dados estatísticos

    # Terminal, progresso e geração de relatórios
    "rich>=15.0.0",                             # saída de terminal bonita e colorida, logging
    "tqdm>=4.70.0",                             # barras de progresso em laços simples
    "markitdown[pptx]>=0.1.7",                  # renderização de Markdown em slides PowerPoint
    "python-pptx>=1.0.2",                       # criação de apresentações PowerPoint

    # Compatibilidade
    "tomli>=2.0.1; python_version < '3.11'",    # tomllib só existe na stdlib a partir do Python 3.11
]

[tool.uv]
# O projeto não é instalado como pacote: `src/` é a raiz de importação (ver
# CLAUDE.md, "Import style"). Instalar `src` no site-packages exigiria imports
# com o prefixo `src.`, contrariando o padrão adotado. O pytest resolve os
# imports por `pythonpath = ["src"]` e `src/main.py` insere o diretório em
# `sys.path` ao ser executado diretamente.
package = false
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Restrições em dependências transitivas por segurança (pip-audit).
# gitpython < 3.1.58 (puxado pelo mlflow) tem CVEs corrigidos na 3.1.58:
# GHSA-9rj7-rf2p-w77r, GHSA-4gmw-gg2m-w46p, GHSA-hh9p-6wh2-4mfc,
# GHSA-wvpp-8hx9-p66j e GHSA-jm78-9fvv-mhgr.
# numba < 0.57.1 (puxado por alguns pacotes) tem CVE-2024-28292.
constraint-dependencies = ["gitpython>=3.1.58", "numba>=0.57.1"]

# diskcache (puxado por dvc -> dvc-data) tem PYSEC-2026-2447 / CVE-2025-69872
# (deserialização insegura via pickle para quem tiver acesso de escrita ao
# diretório de cache). Não há versão corrigida publicada até o momento — a
# 5.6.3 é a mais recente no PyPI e ainda está na faixa afetada. É usado
# apenas como cache local do próprio DVC (não expõe entrada de rede nem
# recebe dados de terceiros), então o risco é aceito e ignorado
# explicitamente no pip-audit (ver `make security` / `.github/workflows/ci.yml`)
# até que o projeto publique uma correção.

# cryptography < 50.0.0 tem PYSEC-2026-3552 (oráculo Bleichenbacher via erros/
# tempo distinguíveis na decriptação de PKCS#7 EnvelopedData). É dependência
# transitiva do mlflow, que fixa `cryptography>=43.0.0,<50` — não há como
# subir a versão sem quebrar o mlflow 3.15.1 (a mais recente publicada). O
# projeto não decripta PKCS#7 diretamente, então o risco é aceito e ignorado
# explicitamente no pip-audit até que o mlflow eleve o teto da dependência.

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

# --- Extras opcionais (ative por projeto: uv sync --extra name, etc.) -------
[project.optional-dependencies]
# Recomendado para os estágios `llm_evaluation` e a análise HypotheSAEs
# (`make install-llm`). Dependências pesadas (PyTorch + CUDA) — não instale
# em ambientes que só rodam ML clássico/DL sobre embeddings estáticos.
llm = [
    "torch>=2.2",                     # backend de tensores para Transformers/DL
    "transformers>=4.44",             # checkpoints Hugging Face (BERTimbau, RoBERTa, DistilBERT, LLMs)
    "accelerate>=0.33",               # execução eficiente de modelos Hugging Face (CPU/GPU)
    "datasets>=2.20",                 # carregamento de datasets do Hugging Face Hub
    "ollama>=0.3",                    # cliente Python do servidor Ollama (LLMs locais)
    "sentencepiece>=0.2.2",           # tokenizador exigido por alguns checkpoints (ex.: RoBERTa/Llama)
    "tiktoken>=0.14.0",               # tokenizador exigido pelo cliente OpenAI-compatível
    "openai>=3.8.0",                  # cliente OpenAI-compatível (usado com o endpoint local do Ollama)
    "langchain-core>=0.3",            # orquestração LCEL (src/llm/chains.py)
    "langchain-ollama>=0.2",          # backend Ollama via LangChain (src/llm/backends.py)
    "langchain-huggingface>=0.1",     # backend Hugging Face via LangChain (src/llm/backends.py)
]

# Recomendado apenas para o estágio `ingestion` (`make install-collect`).
# Coleta de tweets no X/Twitter.
collect = [
    "twscrape>=0.13",                 # scraping assíncrono de tweets
]

# Recomendado para melhorar a tokenização/lematização em pt-BR no
# pré-processamento (`make install-nlp`, que já baixa o modelo). O modelo
# `pt_core_news_sm` exige download à parte (`make spacy-model`); sem ele o
# projeto cai no fallback por regex, com aviso no log.
nlp = [
    "spacy>=3.7",                     # tokenização/lematização em português
]

# Recomendado ao gerar o relatório final de visualizações
# (`src/visualization/`, `reports/figures/`). Ausentes, as figuras
# correspondentes são puladas silenciosamente (com aviso no log).
viz = [
    "wordcloud>=1.9",                 # nuvem de palavras por classe
    "networkx>=3.2",                  # rede de similaridade entre termos/documentos
    "umap-learn>=0.5",                # projeção UMAP dos embeddings/espaço latente
]

# Extensão exploratória — modelo adicional para comparação em notebooks,
# fora do conjunto principal avaliado no protocolo comparativo.
exploratory = [
    "lightgbm>=4.5",                  # Gradient Boosting alternativo ao XGBoost
]

# Recomendado apenas se for versionar `data/`/`models/` fora do Git
# (`make install-dvc` — corpora somam vários GB; ver dvc.yaml).
dvc = [
    "dvc>=3.51",                      # versionamento de dados/modelos
]

# Recomendado apenas se for rodar o dashboard comparativo
# (`make install-app`, `app/dashboard.py`) — não necessário para rodar o
# pipeline de dados/treino/avaliação.
app = [
    "streamlit>=1.60.0",              # dashboard interativo
    "plotly>=5.24",                   # gráficos interativos do dashboard
]


# --- Dependências de desenvolvimento (não publicadas; PEP 735) --------------
[dependency-groups]
dev = [
    # Lint + format
    "ruff>=0.5",                    # Um linter e formatador de código Python extremamente rápido - substitui flake8/isort/black
    # Type checking (roda no CI, não no pre-commit)
    "basedpyright>=1.13",           # Um type checker estático para Python, baseado no Pyright da Microsoft - substitui mypy
    # Segurança (roda no CI)
    "bandit>=1.7",                  # Um analisador de segurança para código Python
    "pip-audit>=2.7",               # Um auditor de segurança para dependências Python (substitui o safety, que arrastava nltk vulnerável)
    "detect-secrets>=1.5",          # Um detector de segredos em código Python
    # Qualidade / complexidade / docstrings
    "vulture>=2.11",                # Um verificador de código morto para Python
    "refurb>=2.0",                  # Um utilitário para refatoração de código Python
    "xenon>=0.9",                   # Um analisador de complexidade para Python
    "radon>=6.0",                   # Um analisador de complexidade para Python
    "interrogate>=1.7",             # Um verificador de docstrings para Python
    # Testes
    "pytest>=8.2",                  # Um framework de teste para Python
    "pytest-cov>=5.0",              # Um plugin para pytest que fornece cobertura de código
    "hypothesis>=6.165.0",            # Um framework de teste property-based para Python
    # Notebooks
    "nbqa>=1.8",                    # Um utilitário para aplicar linters a notebooks do Jupyter
    "nbstripout>=0.7",              # Um utilitário para remover saídas e metadados de notebooks do Jupyter
    # Workflow
    "pre-commit>=3.7",              # Um framework para gerenciar hooks de commit no Git
    "commitizen>=4.16.5",             # Um utilitário para manter o histórico de commits consistente
    # Documentação
    "mkdocs-material>=9.7.7",         # Um tema para MkDocs
    "mkdocstrings[python]>=1.0.6",   # Um plugin para MkDocs que gera documentação a partir de docstrings
    # Profiling (use sob demanda)
    "scalene>=1.5",                 # Um profiler de performance para Python
    # Ferramentas para rodar Data Wrangler no Vscode
    "pip>=26.1.2",                  # Um gerenciador de pacotes para Python
    "ipykernel>=7.3.0",             # Um kernel para Jupyter que executa código Python
    "ipywidgets>=8.1.8"             # Um conjunto de widgets interativos para Jupyter
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/luanfreitas5/sentimento-ptbr-llm"
Documentation = "https://luanfreitas5.github.io/sentimento-ptbr-llm"
Repository = "https://github.com/luanfreitas5/sentimento-ptbr-llm"

[tool.hatch.build.targets.wheel]
packages = ["src"]


# =============================================================================
# RUFF — lint + format (substitui flake8/isort/black)
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (organização de imports)
    "N",      # pep8-naming
    "UP",     # pyupgrade (sintaxe moderna)
    "B",      # flake8-bugbear (bugs comuns e más práticas)
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib (usar Path em vez de os.path)
    "PD",     # pandas-vet — antipadrões específicos de pandas
    "NPY",    # NumPy-specific rules
    "PERF",   # perflint — antipadrões de performance
    "RUF",    # regras específicas do próprio Ruff
    "PL",     # pylint (subconjunto)
    "TRY",    # tryceratops — boas práticas de exception handling
]
ignore = [
    "PLR0913", # muitos argumentos em função — comum em pipelines de ML
    "PLR2004", # "magic value" em comparação — comum em thresholds de modelo
    "TRY003",  # mensagem longa em exceção customizada
    "PLR0917", # muitos parâmetros em função — comum em pipelines de ML
    "PLC0415", # import fora do topo — usado de propósito para dependências
               # opcionais sob demanda (torch, transformers, shap, mlflow,
               # ollama, xgboost, lightgbm, twscrape), para evitar ciclos de
               # import (config.logging -> config.paths) e, nos testes, para
               # isolar imports por caso de teste
    "RUF001",  # caractere ambíguo em string — tipografia pt-BR intencional
               # (x, –) em mensagens e docstrings
    "RUF002",  # idem, em docstrings
    "PERF203", # try/except em loop — usado de propósito para isolar falhas
               # por item (modelo, etapa, tentativa) em loops pequenos; o
               # custo de reexecutar tudo é maior que o overhead do try
]

[tool.ruff.lint.pep8-naming]

[tool.ruff.lint.isort]
# `src/` é a raiz de importação, então os pacotes de primeira parte são os
# diretórios dentro dele — não "src" em si.
known-first-party = [
    "config",
    "constants",
    "data",
    "evaluation",
    "exceptions",
    "experiment",
    "features",
    "hypothesaes",
    "inference",
    "io_utils",
    "labeling",
    "llm",
    "logging_utils",
    "metrics",
    "models",
    "parallel",
    "pipelines",
    "preprocessing",
    "schemas",
    "training",
    "utils",
    "visualization",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"  # docstrings no formato NumPy

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PLR2004", "S101"]  # fixtures, valores fixos e asserts em testes
# Notebooks: imports após células de código (E402), imports só para efeito
# colateral (F401), builtins do IPython como `display` (F821) e a semente
# global do cabeçalho padrão de notebook (NPY002).
"notebooks/*" = ["E402", "F401", "F821", "NPY002"]
"app/*" = ["E402"]                      # sys.path precisa ser ajustado antes dos imports
"src/main.py" = ["E402"]                # idem: `src/` entra no path antes de importar
# `torch = pytest.importorskip("torch")` precisa rodar antes de importar
# `hypothesaes` (que depende de torch no import), para que o módulo inteiro
# seja pulado (não falhe) quando a dependência opcional estiver ausente.
"tests/test_hypothesaes.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

# =============================================================================
# BASEDPYRIGHT — type checking estático (roda no CI)
# =============================================================================
[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = ["src", "tests"]
# `src/` é a raiz de importação: sem isto, `from config.settings import ...`
# não resolveria para o type checker.
extraPaths = ["src"]
exclude = ["**/__pycache__", "notebooks", "data", "models", "reports", "logs"]
reportMissingTypeStubs = false
# Dependências opcionais (torch, transformers, twscrape, spacy, shap, umap,
# wordcloud, networkx, ollama) são importadas sob demanda e podem não estar
# instaladas no ambiente de checagem.
reportMissingImports = "warning"

# =============================================================================
# BANDIT — análise de segurança (roda no CI)
# =============================================================================
[tool.bandit]
exclude_dirs = ["tests", "notebooks", ".venv"]
# B101 (uso de `assert`): os asserts do projeto são exclusivamente estreitamento
# de tipo para o type checker, sempre precedidos de uma validação real que
# levanta exceção própria (ex.: `validate_dataset` antes de
# `assert dataset.labels is not None`). Não há verificação de segurança que
# dependa de assert, então desativá-los com -O não altera o comportamento.
# B105 (possível senha hardcoded): falso positivo em `src/constants/tokens.py`,
# onde os nomes terminam em `_TOKEN` por serem tokens especiais de NLP
# (ex.: `[URL]`, `[PAD]`) usados na normalização textual, não credenciais.
skips = ["B101", "B105"]

# =============================================================================
# VULTURE — detecção de código morto
# =============================================================================
[tool.vulture]
min_confidence = 80
paths = ["src"]
exclude = ["notebooks/"]
# `cls` de validators Pydantic e parâmetros exigidos pela API do
# scikit-learn/protocolo de context manager (`y`, `input_features`,
# `exc_info`) são posicionalmente obrigatórios mas nunca usados no corpo.
ignore_decorators = ["@field_validator", "@model_validator"]
ignore_names = ["cls", "y", "input_features", "exc_info"]

# =============================================================================
# REFURB — sugestões de modernização
# =============================================================================
[tool.refurb]
# Códigos ignorados: ajuste conforme o estilo do projeto
ignore = [
    "FURB105",  # print() sem parênteses vazios — inofensivo, pode ignorar
    "FURB126",  # return implícito — às vezes reduz clareza em funções longas
    # FURB123 (cast redundante): falso positivo sistemático neste projeto — o
    # checker vê `float(x)` como redundante porque `x` já foi anotado/`cast`
    # como `float` para o type checker, mas em tempo de execução `x` é um
    # escalar NumPy (ex.: retorno de `scipy.stats`/`sklearn`); remover o
    # `float()` deixaria o valor real como `np.float64` (quebra serialização
    # JSON/MLflow), não um `float` nativo.
    "FURB123",
]

# =============================================================================
# PYTEST — testes (unit, integração, property-based, comportamentais)
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
filterwarnings = [
    # Avisos internos de bibliotecas de terceiros, fora do nosso controle.
    "ignore:.*set_(bad|over|under) function will be deprecated.*:PendingDeprecationWarning:shap.*",
    "ignore:.*default behavior of `how='horizontal'`.*:DeprecationWarning:pandera.*",
    "ignore:.*`outer_coalesce`.*:DeprecationWarning:polars.*",
    # `matthews_corrcoef` avisa em casos degenerados gerados pelo hypothesis.
    "ignore:.*invalid value encountered in.*:RuntimeWarning",
]
markers = [
    "smoke: testes rápidos rodados no pre-commit",
    "integration: testes de pipeline ponta a ponta",
    "ml: testes comportamentais / de regressão de métrica",
    "slow: testes lentos (pulados por padrão localmente)",
]

# =============================================================================
# COVERAGE — meta de cobertura ≥ 80%
# =============================================================================
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "src/main.py",           # orquestração fina, coberta pelos testes de etapa
    "*/__init__.py",
    "src/data/collector.py", # exige rede e contas do twscrape
    "src/labeling/llm.py",   # exige um servidor Ollama em execução
]

[tool.coverage.report]
fail-under = 80
show-missing = true

# =============================================================================
# INTERROGATE — cobertura de docstrings
# =============================================================================
[tool.interrogate]
fail-under = 50
ignore-init-method = true
ignore-magic = true
exclude = ["tests", "notebooks", "docs"]

# =============================================================================
# COMMITIZEN — Conventional Commits + SemVer + CHANGELOG
# =============================================================================
[tool.commitizen]
name = "cz_conventional_commits"
version = "0.2.0"
version_files = [
    "pyproject.toml:version",
    "src/__init__.py:__version__"
]
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true  # remove quando sair do 0.x
