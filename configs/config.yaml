# Configurações gerais do projeto sentimento-ptbr-llm.
# Análise comparativa de sentimentos (positivo/negativo/neutro) em tweets pt-BR
# entre ML clássico, Deep Learning/Transformers e LLMs locais.

project:
  name: "sentimento-ptbr-llm"
  description: >
    Estudo comparativo entre algoritmos clássicos de Machine Learning, arquiteturas
    de Deep Learning/Transformers e LLMs locais para análise de sentimentos em
    tweets em português brasileiro.
  version: "0.2.0"
  language: "pt-BR"

reproducibility:
  random_seed: 42
  pythonhashseed: 42
  deterministic_algorithms: true

experiment:
  name: "sentimento-ptbr-llm"
  tracking_uri: "mlruns" # sobrescrito por MLFLOW_TRACKING_URI no .env, se definido
  registry_stage_default: "Staging"

labels:
  classes: ["negativo", "neutro", "positivo"]
  target_column: "sentimento"

data_split:
  test_size: 0.2
  validation_size: 0.1
  stratify: true
  random_state: 42

# Estágios executáveis via `python src/main.py --stage <nome>` (src/pipelines/workflow.py),
# na ordem de execução de `--stage all`. A geração de hipóteses (HypotheSAEs) é a
# etapa `hypotheses`; seus modos `patterns` e `diagnostics` são opt-in (--hypotheses-mode).
stages:
  - ingestion
  - preprocessing
  - labeling
  - comparative_evaluation
  - hypotheses
  - features
  - training_classical
  - training_deep_learning
  - training_transformer
  - training_llm
  - evaluate
  - report
