# Caminhos de dados, modelos, relatórios e logs do projeto.
# Todos os caminhos são relativos à raiz do repositório; resolvidos para
# pathlib.Path absolutos em src/config/paths.py.

data:
  bronze: "data/bronze"
  external: "data/bronze/external"
  silver: "data/silver"
  gold: "data/gold"

data_files:
  # Fora de data/bronze/ propositalmente: preprocessing.run_preprocessing_stage
  # (via data.loader.load_raw_tweet_batch) faz glob em data/bronze/*.parquet
  # esperando o lote de tweets brutos coletados por usuário (RawTweetSchema,
  # 13 colunas); o arquivo consolidado de ingestion tem um schema mínimo
  # incompatível (id/text/data_source/data_collected) e colidiria com esse
  # glob, quebrando `--stage all` com um ShapeError do polars.
  raw_tweets: "data/silver/tweets_coletados.parquet"
  corpus_normalizado: "data/silver/corpus_normalizado.parquet"
  corpus_rotulado: "data/gold/corpus_rotulado.parquet"
  # Base rotulada pelo modelo do Hugging Face (todos os tweets) e gold sets rotulados por
  # LLMs via API (amostra do corpus), comparados na etapa `comparative_evaluation` via `id`.
  tweets_data_huggingface: "data/gold/tweets_data_huggingface.parquet"
  gold_openai: "data/gold/gold_gpt-6-luna.parquet"
  gold_unb: "data/gold/gold_UnB-Llama-3.3-70B-Instruct.parquet"
  corpus_treino: "data/gold/treino.parquet"
  corpus_validacao: "data/gold/validacao.parquet"
  corpus_teste: "data/gold/teste.parquet"

labeling:
  # Checkpoints de retomada da rotulagem por LLM (fora do Git: data/* é ignorado).
  checkpoints: "data/silver/labeling_checkpoints"

models:
  checkpoints: "models/checkpoints"
  artifacts: "models/artifacts"
  registry: "models/registry"

mlflow:
  tracking_dir: "mlruns"

logs:
  dir: "logs"

reports:
  figures: "reports/figures"
  tables: "reports/tables"
  metrics: "reports/metrics"
  statistics: "reports/statistics"
  ablation: "reports/ablation"
  interpretability: "reports/interpretability"
  model_cards: "reports/model_cards"
  datasheets: "reports/datasheets"

docs:
  root: "docs"
  guides: "docs/guides"
  assets: "docs/assets"
