# Parâmetros do pipeline de rotulagem de sentimento via Hugging Face.
# Implementa a Seção 4.3 do documento mestre (rotulagem semiautomática + diagnóstico
# via HypotheSAEs e erro de reconstrução do autoencoder).

# Modelo classificador de sentimento do Hugging Face Hub, usado via
# transformers.pipeline("sentiment-analysis") para rotular todo o corpus em
# lote (src/labeling/huggingface.py). sentiment_label/confidence_score são
# sempre preenchidos: um rótulo bruto do modelo fora de label_mapping é
# tratado como falha, nunca gravado vazio.
huggingface:
  model: "pysentimiento/bertweet-pt-sentiment"
  device: "auto" # "auto" | "cpu" | "cuda" | "cuda:0" ...
  batch_size: 32
  max_length: 128
  # Rótulo bruto do modelo -> classe de sentimento em pt-BR
  # (constants/labels.py -> SENTIMENT_CLASSES).
  label_mapping:
    POS: "positivo"
    NEG: "negativo"
    NEU: "neutro"

confidence:
  low_confidence_threshold: 0.5 # abaixo disso, candidato à validação humana

gold_sets:
  tweetsentbr:
    enabled: true
    path: "data/external/tweetsentbr.parquet"
  repro:
    enabled: true
    path: "data/external/repro.parquet"

validation:
  metric: "cohen_kappa"
  minimum_agreement: 0.6
  krippendorff_alpha_minimum: 0.6

human_validation:
  sample_size: 500
  sampling_strategy: "stratified_by_confidence"
  random_state: 42

diagnostics:
  hypothesaes:
    enabled: true
    n_hypotheses: 20
    target: "low_confidence_samples"
  autoencoder_reconstruction_error:
    enabled: true
    anomaly_percentile: 95

# Re-rotulagem via LLM das amostras com confidence_score (concordância da
# cascata) abaixo de score_threshold. Roda após a cascata/consenso e antes
# da incorporação de rótulos humanos (que sempre prevalece sobre o LLM).
# Credenciais do endpoint OpenAI-compatível em OPENAI_BASE_URL/OPENAI_KEY
# (.env — ver .env.example), lidas por src/hypothesaes/llm_api.py.
llm_relabeling:
  enabled: true
  score_threshold: 0.5
  # Nome do template em prompts/ (sem a extensão .txt).
  prompt_name: "labeling_1_rubrica_few-shot_distribuicao_probabilidade"
  model: "UnB-Llama-3.3-70B-Instruct"
  temperature: 0.0
  max_retries: 3
  n_workers: 8
  # Pausa (segundos) antes de cada chamada/tentativa ao LLM, para reduzir a
  # taxa de requisições e evitar bloqueios por limite de taxa (HTTP 429).
  request_interval_seconds: 1.0
