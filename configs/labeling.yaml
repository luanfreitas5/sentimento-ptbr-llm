# Parâmetros do pipeline de rotulagem de sentimento por LLMs (Hugging Face e OpenAI).
# Implementa a Seção 4.3 do documento mestre (rotulagem por LLMs + diagnóstico
# via HypotheSAEs e erro de reconstrução do autoencoder).

# A etapa `labeling` (src/pipelines/labeling.py) gera três bases, relacionadas pelo `id`:
#   * `tweets_data_huggingface`: TODOS os tweets, rotulados por modelo do Hugging Face
#     (única fonte que alimenta as etapas seguintes: features, treino, hypothesaes_analysis);
#   * `gold_openai` e `gold_UnB-Llama-3.3-70B-Instruct`: a MESMA amostra do corpus,
#     rotulada por LLMs via API OpenAI-compatível, que fazem o papel de gold sets
#     (referência) na etapa `comparative_evaluation`.
# Os LLMs da API usam o mesmo prompt versionado em prompts/ (marcador {{TEXTO}}) e recebem
# o texto já sanitizado (`text_normalized`: sem @menções/URLs — LGPD).

# Prompt dos gold sets via API (nome em prompts/, sem a extensão .txt); a fonte `huggingface`
# usa um classificador ajustado e não recebe prompt.
prompt_name: "labeling_1_rubrica_few-shot_distribuicao_probabilidade"

# Classificador de sentimento do Hugging Face Hub (src/labeling/huggingface.py), via
# transformers. BERTweet-pt ajustado (classes NEG/NEU/POS): é um encoder de ~135M de
# parâmetros, roda em CPU ou em qualquer GPU, é determinístico e NÃO usa o `prompt_name`.
# A confiança é a probabilidade softmax da classe escolhida. Para modelos de acesso
# restrito, defina SENTIMENTO_HUGGINGFACE_TOKEN no .env. A memória da GPU é liberada a
# cada lote.
huggingface:
  model: "pysentimiento/bertweet-pt-sentiment" # Hugging Face Hub (https://huggingface.co/pysentimiento/bertweet-pt-sentiment)
  revision: "main" # ATENÇÃO: fixe o SHA do commit do modelo para reprodutibilidade exata
  device: "auto" # "auto" | "cpu" | "cuda" | "cuda:0" ...
  dtype: "auto" # "auto" | "float16" | "bfloat16" | "float32"
  batch_size: 64 # tweets por lote (e por gravação no checkpoint)
  max_input_tokens: 128 # limite do BERTweet-pt (o excedente é truncado)

# Parâmetros comuns da chamada à API OpenAI-compatível (src/labeling/openai_labeler.py),
# autenticada por OPENAI_BASE_URL/OPENAI_KEY no .env (ver .env.example), via Chat
# Completions. Proteção contra HTTP 429: limite de `requests_per_minute` somado entre as
# threads, pausa global no 429 (respeitando Retry-After) e ritmo adaptativo.
# Resposta fora do formato ou texto vazio => sentiment_label "indefinido" com score 0.0.
openai:
  temperature: 0.0 # ignorada quando o gold set define `reasoning_effort`
  max_tokens: 100 # a resposta é um JSON curto (rótulo + probabilidades)
  batch_size: 50 # tweets por lote (e por gravação no checkpoint)
  n_workers: 4 # requisições concorrentes dentro de um lote
  parallel_batches: 1 # lotes simultâneos (pool contínuo); total de threads = n_workers x parallel_batches
  # Modos rápidos (mudam o hash do checkpoint quando diferentes do padrão json + 1):
  response_mode: "json" # "json" (JSON completo) | "label_logprobs" (só o rótulo; confiança = softmax do 1º token; exige logprobs no endpoint)
  tweets_per_request: 1 # >1 agrupa tweets numerados por requisição
  requests_per_minute: 120 # limite base, somado entre as threads (null desativa)
  request_timeout_seconds: 60
  max_retries: 3 # falhas de API (exceto 429)
  max_rate_limit_retries: 8 # retentativas após HTTP 429

confidence:
  low_confidence_threshold: 0.5 # abaixo disso, candidato à validação humana

# Gold sets: amostra do corpus normalizado rotulada por dois LLMs da API OpenAI-compatível.
# A amostra é a mesma nos dois (mesma `random_state` e `sample_size`), então os gold sets
# cobrem exatamente os mesmos tweets. Cada um é uma execução separada
# (`--label-source gold_openai` / `gold_unb`): o endpoint vem de OPENAI_BASE_URL/OPENAI_KEY,
# então troque o `.env` entre as execuções se os modelos estiverem em endpoints diferentes.
gold_sets:
  sample_size: 1000 # tweets da amostra (limitada ao tamanho do corpus)
  random_state: 42
  openai:
    model: "gpt-6-luna"
    reasoning_effort: "low" # modelo de raciocínio: sem temperature; usa max_completion_tokens
    max_tokens: 2048 # inclui os tokens de raciocínio, por isso é maior que `openai.max_tokens`
  unb:
    model: "UnB-Llama-3.3-70B-Instruct"
    reasoning_effort: null
    max_tokens: null # null = usa `openai.max_tokens`

validation:
  metric: "cohen_kappa"
  minimum_agreement: 0.6
  krippendorff_alpha_minimum: 0.6

human_validation:
  sample_size: 500
  sampling_strategy: "stratified_by_confidence"
  random_state: 42

diagnostics:
  hypothesaes:
    enabled: true
    n_hypotheses: 20
    target: "low_confidence_samples"
  autoencoder_reconstruction_error:
    enabled: true
    anomaly_percentile: 95
