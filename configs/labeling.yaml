# Parâmetros do pipeline de rotulagem de sentimento por LLMs (Hugging Face e OpenAI).
# Implementa a Seção 4.3 do documento mestre (rotulagem por LLMs + diagnóstico
# via HypotheSAEs e erro de reconstrução do autoencoder).

# Rotulagem de TODOS os tweets por duas fontes independentes (src/pipelines/labeling.py),
# gerando as bases `tweets_data_huggingface` e `tweets_data_openai` (mesmos tweets,
# relacionados pelo `id`), comparadas depois pela etapa `comparative_evaluation`.
# Ambas usam o mesmo prompt versionado em prompts/ (marcador {{TEXTO}}) e recebem o
# texto já sanitizado (`text_normalized`: sem @menções/URLs — LGPD).

# Fonte cujo rótulo vira `sentiment_label` em corpus_rotulado.parquet, consumido pelas
# etapas seguintes (features, treino, hypothesaes_analysis). A outra base é preservada
# nas colunas `sentiment_label_<fonte>`/`confidence_score_<fonte>`.
downstream_source: "huggingface" # "huggingface" | "openai"

# Prompt compartilhado pelas duas fontes (nome em prompts/, sem a extensão .txt).
prompt_name: "labeling_1_rubrica_few-shot_distribuicao_probabilidade"

# LLM local do Hugging Face Hub (src/labeling/huggingface.py), via transformers.
# ATENÇÃO à VRAM: um modelo de 8B em bfloat16 exige ~16 GB; com load_in_4bit (exige
# bitsandbytes) ~6 GB. Em GPUs pequenas, troque `model` por um modelo menor (ex.:
# "Qwen/Qwen2.5-1.5B-Instruct"). Modelos com licença restrita (Llama, Gemma) exigem
# SENTIMENTO_HUGGINGFACE_TOKEN no .env. A memória da GPU é liberada a cada lote.
huggingface:
  model: "meta-llama/Meta-Llama-3.1-8B-Instruct"
  revision: "main" # ATENÇÃO: fixe o SHA do commit do modelo para reprodutibilidade exata
  device: "auto" # "auto" | "cpu" | "cuda" | "cuda:0" ...
  dtype: "auto" # "auto" | "float16" | "bfloat16" | "float32"
  load_in_4bit: false
  batch_size: 8 # tweets por lote (e por gravação no checkpoint)
  max_new_tokens: 64 # o JSON de resposta tem ~40 tokens
  max_input_tokens: 1536 # prompt (~650 tokens) + tweet
  temperature: 0.0 # 1ª tentativa gulosa (determinística)
  max_retries: 3 # as novas tentativas amostram com retry_temperature
  retry_temperature: 0.3

# LLM via API OpenAI-compatível (src/labeling/openai_labeler.py), autenticada por
# OPENAI_BASE_URL/OPENAI_KEY no .env (ver .env.example; o endpoint da UnB é o padrão do
# projeto). Proteção contra HTTP 429: pausa `request_interval_seconds` antes de cada
# chamada (time.sleep) e backoff exponencial entre tentativas.
openai:
  model: "UnB-Llama-3.3-70B-Instruct"
  temperature: 0.0
  batch_size: 50 # tweets por lote (e por gravação no checkpoint)
  n_workers: 4 # taxa efetiva ~ n_workers / request_interval_seconds req/s
  request_interval_seconds: 1.0
  request_timeout_seconds: 60
  max_retries: 3

confidence:
  low_confidence_threshold: 0.5 # abaixo disso, candidato à validação humana

gold_sets:
  tweetsentbr:
    enabled: true
    path: "data/external/tweetsentbr.parquet"
  repro:
    enabled: true
    path: "data/external/repro.parquet"

validation:
  metric: "cohen_kappa"
  minimum_agreement: 0.6
  krippendorff_alpha_minimum: 0.6

human_validation:
  sample_size: 500
  sampling_strategy: "stratified_by_confidence"
  random_state: 42

diagnostics:
  hypothesaes:
    enabled: true
    n_hypotheses: 20
    target: "low_confidence_samples"
  autoencoder_reconstruction_error:
    enabled: true
    anomaly_percentile: 95
