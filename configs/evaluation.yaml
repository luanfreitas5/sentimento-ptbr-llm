# Métricas principais, testes estatísticos e thresholds de avaliação.
# Implementa as Seções 4.8 (Métricas) e 4.9 (Análises Estatísticas) do
# documento mestre.

metrics:
  primary: "f1_macro" # justificativa: robusto ao desbalanceamento típico entre classes
  secondary: ["mcc", "f1_weighted", "accuracy", "precision_macro", "recall_macro"]
  ranking: ["roc_auc_ovr", "pr_auc_ovr"] # one-vs-rest, cenário multiclasse
  operational: ["inference_time_ms", "computational_cost"]

cross_validation:
  n_splits: 5
  strategy: "stratified_k_fold"
  random_state: 42

uncertainty:
  method: "bootstrap"
  n_bootstrap: 1000
  confidence_level: 0.95

significance_tests:
  pairwise: "mcnemar" # comparação par a par entre classificadores
  paired_multi_fold: "wilcoxon" # comparação pareada ao longo de múltiplos folds
  multi_model: "friedman" # comparação simultânea entre mais de dois modelos
  post_hoc: "nemenyi"
  alpha: 0.05

calibration:
  enabled: true
  method: "reliability_curve"
  n_bins: 10
  metric: "brier_score"

slice_evaluation:
  enabled: true
  slices: ["fonte_dados", "classe", "comprimento_texto"]

# Falha o build/pipeline se a métrica principal cair abaixo do limiar acordado.
regression_thresholds:
  f1_macro_minimum: 0.65
  mcc_minimum: 0.45

# Estágio `evaluate`: ablação do pipeline clássico, avaliada na VALIDAÇÃO (nunca no teste).
# Cada componente remove uma peça por vez da configuração completa (model_params.yaml ->
# classical.logistic_regression + TF-IDF abaixo); `sem_*` = componente desligado.
ablation:
  model: "logistic_regression"
  model_params: {} # vazio = usa classical.logistic_regression do model_params.yaml (via main.py)
  tfidf_params:
    ngram_range: [1, 2]
    max_features: 20000
    min_document_frequency: 3
    sublinear_term_frequency: true
  components:
    sem_bigramas:
      tfidf: { ngram_range: [1, 1] }
    sem_tf_sublinear:
      tfidf: { sublinear_term_frequency: false }
    sem_limite_vocabulario:
      tfidf: { max_features: 1000000 }
    sem_filtro_frequencia_minima:
      tfidf: { min_document_frequency: 1 }
    sem_class_weight:
      model: { class_weight: null }

# Estágio `evaluate`: LLMs são caros; limita quantos tweets de teste cada um recebe
# (null = todo o teste). A comparação estatística usa só os tweets preditos por ambos.
evaluate:
  llm_max_test_samples: 500

# Etapa `comparative_evaluation` (src/pipelines/comparative_evaluation.py): compara as
# bases `tweets_data_huggingface` e `tweets_data_openai` pelo `id` do tweet.
llm_comparison:
  output_subdir: "comparativo_hf_openai" # subpasta em reports/tables, reports/figures e reports/metrics
  random_seed: 42
  n_bootstrap: 1000 # IC bootstrap de concordância e kappa
  confidence_level: 0.95
  top_n_divergences: 50 # tweets com maior divergência exportados
  high_confidence_threshold: 0.8 # "alta confiança" (conflito de confiança)
  low_confidence_threshold: 0.5 # "baixa confiança" (conflito de confiança e ambiguidade)
  n_length_bins: 5 # quantis do tamanho do texto (em palavras)
  examples_per_transition: 3 # exemplos por par de classes divergentes

# Estágio `hypotheses` (src/pipelines/hypotheses.py, modo `disagreement`): HypotheSAEs sobre a
# divergência/incerteza entre as duas bases (src/diagnostics/model_disagreement.py; usa
# configs/diagnostics.yaml). Exige as dependências pesadas (`make install-hypothesaes`) e o LLM
# configurado em diagnostics.yaml. Grava em reports/tables/<llm_comparison.output_subdir>/.
hypotheses:
  targets: ["disagreement", "uncertainty"]
  top_tweets_per_hypothesis: 10 # tweets mais ativados por hipótese, exportados como evidência
