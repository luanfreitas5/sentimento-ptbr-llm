# =============================================================================
# mkdocs.yml — documentação com MkDocs Material + mkdocstrings.
#
# A referência da API é gerada automaticamente a partir das docstrings NumPy
# (em pt-BR). Publicada no GitHub Pages via .github/workflows/docs.yml.
#
# Servir localmente:  make docs-serve
# Publicar:           make docs-deploy
#
# Precisa estar na raiz do repositório: `docs_dir: docs` é resolvido
# relativo a este arquivo (ver PLANO-ELABORACAO.md, Fase 20).
# =============================================================================

site_name: sentimento-ptbr-llm
site_description: >-
  Análise comparativa de sentimentos em tweets pt-BR entre ML clássico,
  Deep Learning/Transformers e LLMs locais.
site_author: Luan Freitas
repo_url: https://github.com/luanfreitas5/sentimento-ptbr-llm
repo_name: luanfreitas5/sentimento-ptbr-llm
edit_uri: edit/main/docs/
docs_dir: docs

theme:
  name: material
  language: pt-BR
  icon:
    repo: fontawesome/brands/github
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search:
      lang: pt
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy        # docstrings no formato NumPy
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            filters: ["!^_"]              # oculta membros privados

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Guias:
      - Metodologia: guides/metodologia.md
      - Pipeline: guides/pipeline.md
      - Reprodutibilidade: guides/reprodutibilidade.md
      - Setup: guides/setup.md
  - Referência da API: reference.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/luanfreitas5

copyright: >-
  Código sob licença MIT. Os dados não são redistribuídos.
