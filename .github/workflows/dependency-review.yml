# =============================================================================
# Dependency Review — audita as dependências ALTERADAS em cada PR contra a
# advisory database do GitHub (CVEs conhecidas e licenças incompatíveis).
# Complementa o pip-audit (ci.yml, roda em todo push + semanalmente) e o
# Dependabot (dependabot.yml, PRs semanais de atualização): este workflow
# pega o problema no momento em que a dependência nova é introduzida no PR.
# =============================================================================
name: Dependency Review

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Revisar dependências alteradas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verificar suporte ao Dependency Review
        id: dependency-review-support
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          status_code="$(
            curl -sS -o "${response_file}" -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          )"

          if [[ "${status_code}" == "200" ]]; then
            echo "supported=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if grep -q "Dependency review is not supported on this repository" "${response_file}"; then
            echo "::warning::Dependency Review não é suportado neste repositório (Dependency Graph desativado). Job marcado como sucesso para não bloquear o PR."
            echo "supported=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "::error::Falha ao verificar suporte ao Dependency Review (HTTP ${status_code})."
          cat "${response_file}"
          exit 1

      - if: steps.dependency-review-support.outputs.supported == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
