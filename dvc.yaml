# =============================================================================
# dvc.yaml — DAG reprodutível dos estágios de dados/modelagem.
#
# Espelha os estágios de `src/main.py --stage <nome>` (ver configs/config.yaml
# -> stages e src/pipelines/workflow.py). O acoplamento entre estágios é o
# sistema de arquivos (Parquet em data/, modelos em models/), então cada
# estágio pode ser reexecutado isoladamente com `dvc repro <nome>`.
#
# Métricas de treino/avaliação (F1-macro, MCC, etc.) são registradas no
# MLflow (mlruns/ — ver `Trainer(track_with_mlflow=True)`), não como
# `metrics:` do DVC: o DVC aqui versiona dados e artefatos de modelo: o
# MLflow é a fonte de verdade para comparar métricas entre execuções.
# =============================================================================

vars:
  - params.yaml

stages:
  ingestion:
    cmd: uv run python src/main.py --stage ingestion --scrape-func ${scrape_func} --queries ${queries}
    deps:
      - src/pipelines/ingestion.py
      - src/data/downloader.py
    outs:
      - data/silver/tweets_coletados.parquet
      - data/bronze/catalog.json

  preprocessing:
    cmd: uv run python src/main.py --stage preprocessing
    deps:
      - src/pipelines/preprocessing.py
      - src/preprocessing
      - data/silver/tweets_coletados.parquet
    outs:
      - data/silver/corpus_normalizado.parquet

  labeling:
    cmd: uv run python src/main.py --stage labeling --label-source all
    deps:
      - src/pipelines/labeling.py
      - src/labeling
      - prompts
      - data/silver/corpus_normalizado.parquet
    params:
      - configs/labeling.yaml:
    outs:
      - data/gold/tweets_data_twitter-xlm-roberta-base-sentiment-multilingual.parquet
      - data/gold/gold_gpt-6-luna.parquet
      - data/gold/gold_UnB-Llama-3.3-70B-Instruct.parquet
      - data/gold/corpus_rotulado.parquet

  comparative_evaluation:
    cmd: uv run python src/main.py --stage comparative_evaluation
    deps:
      - src/pipelines/comparative_evaluation.py
      - src/evaluation/llm_comparison.py
      - src/visualization/comparison.py
      - data/gold/tweets_data_twitter-xlm-roberta-base-sentiment-multilingual.parquet
      - data/gold/tweets_data_bertweet-pt-sentiment.parquet
      - data/gold/gold_gpt-6-luna.parquet
      - data/gold/gold_UnB-Llama-3.3-70B-Instruct.parquet
    params:
      - configs/evaluation.yaml:
          - llm_comparison
    outs:
      - reports/metrics/comparativo_twitter-xlm-roberta-base-sentiment-multilingual_vs_bertweet-pt-sentiment.json:
          cache: false
      - reports/tables/comparativo_twitter-xlm-roberta-base-sentiment-multilingual_vs_bertweet-pt-sentiment:
          cache: false
      - reports/figures/comparativo_twitter-xlm-roberta-base-sentiment-multilingual_vs_bertweet-pt-sentiment:
          cache: false
      - reports/metrics/comparativo_twitter-xlm-roberta-base-sentiment-multilingual_vs_gpt-6-luna.json:
          cache: false
      - reports/metrics/comparativo_twitter-xlm-roberta-base-sentiment-multilingual_vs_UnB-Llama-3.3-70B-Instruct.json:
          cache: false
      - reports/tables/comparativo_twitter-xlm-roberta-base-sentiment-multilingual_vs_gpt-6-luna:
          cache: false
      - reports/tables/comparativo_twitter-xlm-roberta-base-sentiment-multilingual_vs_UnB-Llama-3.3-70B-Instruct:
          cache: false
      - reports/figures/comparativo_twitter-xlm-roberta-base-sentiment-multilingual_vs_gpt-6-luna:
          cache: false
      - reports/figures/comparativo_twitter-xlm-roberta-base-sentiment-multilingual_vs_UnB-Llama-3.3-70B-Instruct:
          cache: false

  # Modo padrão (`disagreement`): HypotheSAEs sobre a discordância/incerteza entre o Hugging Face e cada gold set.
  # Os modos `patterns` e `diagnostics` são opt-in (`--hypotheses-mode`) e ficam fora do DAG.
  hypotheses:
    cmd: uv run python src/main.py --stage hypotheses
    deps:
      - src/pipelines/hypotheses.py
      - src/diagnostics
      - data/gold/tweets_data_twitter-xlm-roberta-base-sentiment-multilingual.parquet
      - data/gold/gold_gpt-6-luna.parquet
      - data/gold/gold_UnB-Llama-3.3-70B-Instruct.parquet
    params:
      - configs/evaluation.yaml:
          - hypotheses
      - configs/diagnostics.yaml:
    outs:
      - reports/metrics/hipoteses_comparativo_twitter-xlm-roberta-base-sentiment-multilingual_vs_gpt-6-luna.json:
          cache: false
      - reports/metrics/hipoteses_comparativo_twitter-xlm-roberta-base-sentiment-multilingual_vs_UnB-Llama-3.3-70B-Instruct.json:
          cache: false

  features:
    cmd: uv run python src/main.py --stage features
    deps:
      - src/pipelines/features.py
      - src/features
      - data/gold/corpus_rotulado.parquet
    params:
      - configs/config.yaml:
          - data_split
      - configs/model_params.yaml:
          - embeddings
    outs:
      - data/gold/treino.parquet
      - data/gold/validacao.parquet
      - data/gold/teste.parquet
      - data/gold/tfidf_features.parquet
      - models/checkpoints/tfidf_vectorizer.joblib:
          persist: true

  training_classical:
    cmd: uv run python src/main.py --stage training_classical
    deps:
      - src/pipelines/training_classical.py
      - src/models
      - src/training
      - data/gold/treino.parquet
      - data/gold/validacao.parquet
      - models/checkpoints/tfidf_vectorizer.joblib
    params:
      - configs/model_params.yaml:
          - classical
    outs:
      - models/checkpoints/dummy.joblib:
          persist: true
      - models/checkpoints/naive_bayes.joblib:
          persist: true
      - models/checkpoints/logistic_regression.joblib:
          persist: true
      - models/checkpoints/svm.joblib:
          persist: true
      - models/checkpoints/random_forest.joblib:
          persist: true
      - models/checkpoints/gradient_boosting.joblib:
          persist: true

  training_deep_learning:
    cmd: uv run python src/main.py --stage training_deep_learning
    deps:
      - src/pipelines/training_deep_learning.py
      - src/models
      - src/training
      - data/gold/treino.parquet
      - data/gold/validacao.parquet
    params:
      - configs/model_params.yaml:
          - deep_learning
    outs:
      - models/checkpoints/lstm.pt:
          persist: true
      - models/checkpoints/cnn.pt:
          persist: true

  training_transformer:
    cmd: uv run python src/main.py --stage training_transformer
    deps:
      - src/pipelines/training_transformer.py
      - src/pipelines/training_deep_learning.py
      - src/models
      - src/training
      - data/gold/treino.parquet
      - data/gold/validacao.parquet
    params:
      - configs/model_params.yaml:
          - transformers
    outs:
      - models/checkpoints/bertimbau.pt:
          persist: true
      - models/checkpoints/roberta.pt:
          persist: true
      - models/checkpoints/distilbert.pt:
          persist: true

  training_llm:
    cmd: uv run python src/main.py --stage training_llm
    deps:
      - src/pipelines/training_llm.py
      - src/models/llm.py
      - data/gold/treino.parquet
      - data/gold/validacao.parquet
    params:
      - configs/model_params.yaml:
          - llm
      - configs/evaluation.yaml:
          - evaluate
    outs:
      - models/checkpoints/llama3_2.llm.json:
          cache: false

  evaluate:
    cmd: uv run python src/main.py --stage evaluate
    deps:
      - src/pipelines/evaluate.py
      - src/evaluation
      - data/gold/treino.parquet
      - data/gold/validacao.parquet
      - data/gold/teste.parquet
      - models/checkpoints
    params:
      - configs/evaluation.yaml:
          - uncertainty
          - significance_tests
          - ablation
          - evaluate
    outs:
      - reports/tables/avaliacao:
          cache: false
      - reports/statistics:
          cache: false
      - reports/ablation:
          cache: false
      - reports/metrics/avaliacao.json:
          cache: false

  report:
    cmd: uv run python src/main.py --stage report
    deps:
      - src/pipelines/report.py
      - src/reporting
      - src/visualization/evaluation.py
      - reports/tables/avaliacao
      - reports/statistics
      - reports/ablation
      - reports/metrics/avaliacao.json
    outs:
      - reports/figures/avaliacao:
          cache: false
      - reports/tables/relatorio:
          cache: false
      - reports/model_cards:
          cache: false
      - reports/datasheets:
          cache: false
